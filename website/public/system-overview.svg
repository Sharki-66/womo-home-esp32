<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" font-family="system-ui,sans-serif">

  <rect width="100%" height="100%" fill="#0d1829" rx="16"/>

  <!-- ── ROUTER ── -->
  <rect x="20" y="16" width="155" height="68" rx="10" fill="#132742" stroke="rgba(34,211,238,0.4)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="97" y="46" text-anchor="middle" fill="#f3f4f6" font-size="13" font-weight="bold">Router</text>
  <text x="97" y="64" text-anchor="middle" fill="#9ca3af" font-size="10">Teltonika RUTX11</text>
  <!-- WiFi Funkwellen (rechtsseitige Bögen) -->
  <path d="M 178,32 A 18,18 0 0,1 178,66" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 178,37 A 13,13 0 0,1 178,63" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 178,42 A 8,8 0 0,1 178,58"  fill="none" stroke="#22d3ee" stroke-width="2"   stroke-linecap="round"/>
  <!-- WiFi Linie zum Sensorboard -->
  <line x1="196" y1="50" x2="342" y2="118" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="338,118 333,108 348,115" fill="#22d3ee"/>
  <text x="262" y="76" text-anchor="middle" fill="#22d3ee" font-size="10" font-style="italic">WiFi</text>

  <!-- ── SENSORBEE ── -->
  <rect x="612" y="16" width="155" height="68" rx="10" fill="#132742" stroke="rgba(129,140,248,0.4)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="689" y="46" text-anchor="middle" fill="#f3f4f6" font-size="13" font-weight="bold">SensorBee</text>
  <text x="689" y="64" text-anchor="middle" fill="#9ca3af" font-size="10">ESP32-C3</text>
  <!-- BLE Funkwellen (linksseitige Bögen) -->
  <path d="M 609,32 A 18,18 0 0,0 609,66" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 609,37 A 13,13 0 0,0 609,63" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 609,42 A 8,8 0 0,0 609,58"  fill="none" stroke="#818cf8" stroke-width="2"   stroke-linecap="round"/>
  <!-- BLE Linie zum Sensorboard -->
  <line x1="592" y1="50" x2="444" y2="118" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="440,118 447,109 451,119" fill="#818cf8"/>
  <text x="526" y="76" text-anchor="middle" fill="#818cf8" font-size="10" font-style="italic">BLE</text>

  <!-- ── DISPLAY ── -->
  <rect x="22" y="150" width="158" height="115" rx="12" fill="#132742" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="101" y="180" text-anchor="middle" fill="#f3f4f6" font-size="14" font-weight="bold">Display</text>
  <text x="101" y="198" text-anchor="middle" fill="#9ca3af" font-size="11">ESP32-S3 · 7"</text>
  <rect x="51" y="209" width="100" height="23" rx="6" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="1"/>
  <text x="101" y="225" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">Buzzer</text>

  <!-- RS485 bidirektional -->
  <line x1="182" y1="196" x2="285" y2="196" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="281,191 293,196 281,201" fill="#fbbf24"/>
  <line x1="285" y1="208" x2="182" y2="208" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="186,203 174,208 186,213" fill="#fbbf24"/>
  <text x="233" y="188" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">RS485</text>

  <!-- ── SENSORBOARD ── -->
  <rect x="291" y="118" width="215" height="165" rx="12" fill="#132742" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="398" y="154" text-anchor="middle" fill="#f3f4f6" font-size="14" font-weight="bold">Sensorboard</text>
  <text x="398" y="172" text-anchor="middle" fill="#9ca3af" font-size="11">ESP32-S3</text>
  <text x="398" y="194" text-anchor="middle" fill="#6b7280" font-size="10">IMU (Lagesystem) on-board</text>

  <!-- Kabelstrang -->
  <line x1="508" y1="200" x2="600" y2="200" stroke="#9ca3af" stroke-width="3"/>
  <polygon points="596,195 609,200 596,205" fill="#9ca3af"/>
  <text x="554" y="191" text-anchor="middle" fill="#9ca3af" font-size="10">Kabelstrang</text>

  <!-- ── EBL ── -->
  <rect x="608" y="161" width="148" height="80" rx="12" fill="#132742" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <text x="682" y="197" text-anchor="middle" fill="#f3f4f6" font-size="14" font-weight="bold">EBL</text>
  <text x="682" y="215" text-anchor="middle" fill="#9ca3af" font-size="11">Schaudt EBL262-3</text>

  <!-- ── SENSOR-BUS ── -->
  <!-- 6 Boxen à 100px, Abstand 10px → Gesamt 650px, Start x=85, Mitten: 135,245,355,465,575,685 -->
  <line x1="398" y1="283" x2="398" y2="318" stroke="#475569" stroke-width="1.5"/>
  <line x1="135" y1="318" x2="685" y2="318" stroke="#475569" stroke-width="1.5"/>

  <!-- Waage A -->
  <line x1="135" y1="318" x2="135" y2="346" stroke="#475569" stroke-width="1.5"/>
  <rect x="85"  y="346" width="100" height="62" rx="8" fill="#132742" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="135" y="376" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Waage A</text>

  <!-- Waage B -->
  <line x1="245" y1="318" x2="245" y2="346" stroke="#475569" stroke-width="1.5"/>
  <rect x="195" y="346" width="100" height="62" rx="8" fill="#132742" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="245" y="376" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Waage B</text>

  <!-- BME innen -->
  <line x1="355" y1="318" x2="355" y2="346" stroke="#475569" stroke-width="1.5"/>
  <rect x="305" y="346" width="100" height="62" rx="8" fill="#132742" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="355" y="373" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">BME innen</text>
  <text x="355" y="391" text-anchor="middle" fill="#9ca3af" font-size="10">BME680</text>

  <!-- BME außen -->
  <line x1="465" y1="318" x2="465" y2="346" stroke="#475569" stroke-width="1.5"/>
  <rect x="415" y="346" width="100" height="62" rx="8" fill="#132742" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="465" y="373" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">BME außen</text>
  <text x="465" y="391" text-anchor="middle" fill="#9ca3af" font-size="10">BME280</text>

  <!-- Tank 1 -->
  <line x1="575" y1="318" x2="575" y2="346" stroke="#475569" stroke-width="1.5"/>
  <rect x="525" y="346" width="100" height="62" rx="8" fill="#132742" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="575" y="373" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Tank 1</text>
  <text x="575" y="391" text-anchor="middle" fill="#9ca3af" font-size="10">Votronic</text>

  <!-- Tank 2 -->
  <line x1="685" y1="318" x2="685" y2="346" stroke="#475569" stroke-width="1.5"/>
  <rect x="635" y="346" width="100" height="62" rx="8" fill="#132742" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <text x="685" y="373" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Tank 2</text>
  <text x="685" y="391" text-anchor="middle" fill="#9ca3af" font-size="10">Votronic</text>

  <!-- Gruppen-Labels -->
  <text x="190" y="425" text-anchor="middle" fill="#6b7280" font-size="10">Gaswaagen</text>
  <text x="410" y="425" text-anchor="middle" fill="#6b7280" font-size="10">Klimasensoren</text>
  <text x="630" y="425" text-anchor="middle" fill="#6b7280" font-size="10">Tanksensoren</text>

</svg>
