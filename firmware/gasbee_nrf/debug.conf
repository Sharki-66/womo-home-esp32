# GasBee nRF – Testmodus, zusätzlich zu prj.conf
# Build: west build ... -- -DEXTRA_CONF_FILE=debug.conf
# Status-LED, Messintervall 60 s, USB-CDC-Konsole + Log (/dev/ttyGASBEE_*).
# Kostet im Akkubetrieb ca. 1,9 mA statt 6,7 µA Ruhestrom – nur zum Testen.

CONFIG_GASBEE_STATUS_LED=y
CONFIG_GASBEE_MEASURE_INTERVAL_S=60

# USB-CDC-Konsole und Log (in prj.conf abgeschaltet)
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y
