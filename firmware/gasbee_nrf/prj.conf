# GasBee nRF – Projektkonfiguration (Normalbetrieb)
# UF2-Ausgabe und GPIO bringt das Board xiao_ble mit.

# Stromsparen: kein USB-Stack, keine USB-Konsole, kein Log.
# Gemessen 2026-10-18/19 im Akkubetrieb (Ruhestrom zwischen den Messungen):
#   mit USB-CDC-Konsole + Log: ca. 1,9 mA, ohne: 6,7 µA.
# Testmodus (debug.conf) schaltet USB-Konsole und Log wieder ein.
# Flashen per UF2-Bootloader und die VBUS-Erkennung (Konfigurationsmodus)
# funktionieren unabhängig davon.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# Bluetooth: Peripheral mit GATT-Server
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="GasBee"
CONFIG_BT_MAX_CONN=1
# Advertising-Set mit fester Paketzahl (Burst), Pakete bleiben Legacy-PDUs
CONFIG_BT_EXT_ADV=y

# Kalibrierung persistent (Settings auf NVS, Partition storage)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Akkuspannung: voltage-divider (Sensor-API) auf SAADC AIN7, siehe app.overlay
CONFIG_SENSOR=y
CONFIG_ADC=y

# Stromsparen: Gerätezustände steuerbar, damit der unbenutzte QSPI-Flash
# (P25Q16H) beim Start in Deep Power-Down gehen kann (nur mit PM_DEVICE)
CONFIG_PM_DEVICE=y

# Stack für main (Settings, im Testmodus Float-Logging)
CONFIG_MAIN_STACK_SIZE=2048
