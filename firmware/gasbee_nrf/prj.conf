# GasBee nRF – Projektkonfiguration
# USB-CDC-Konsole, UF2-Ausgabe und GPIO bringt das Board xiao_ble bereits mit.

# Logging über USB-CDC
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y

# Bluetooth: Peripheral mit GATT-Server
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="GasBee"
CONFIG_BT_MAX_CONN=1
# Advertising-Set mit fester Paketzahl (Burst), Pakete bleiben Legacy-PDUs
CONFIG_BT_EXT_ADV=y

# Kalibrierung persistent (Settings auf NVS, Partition storage)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Akkuspannung: voltage-divider (Sensor-API) auf SAADC AIN7, siehe app.overlay
CONFIG_SENSOR=y
CONFIG_ADC=y

# Stack für main (Settings + Float-Logging)
CONFIG_MAIN_STACK_SIZE=2048
